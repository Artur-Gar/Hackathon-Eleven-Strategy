    "pandas (>=3.0.0,<4.0.0)",
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "jupyterlab (>=4.5.3,<5.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "pyarrow (>=23.0.0,<24.0.0)",
    "pmdarima (>=2.1.1,<3.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
